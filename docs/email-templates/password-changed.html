<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your password was changed</title>
</head>
<body style="margin:0; padding:0; background-color:#e8e8e8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#e8e8e8" style="background-color:#e8e8e8; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:480px; max-width:100%;">

          <tr>
            <td align="center" style="padding-bottom:28px;">
              <img src="https://icwnuxzfxklwhibzwikj.supabase.co/storage/v1/object/public/assets/inertia-wordmark-white.png" width="126" height="45" alt="Inertia" style="display:block; width:126px; height:45px; border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic;" />
            </td>
          </tr>

          <tr>
            <td bgcolor="#f0f0f0" style="background-color:#f0f0f0; border:1px solid #e1e1e1; border-radius:8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:32px 32px 28px 32px;">
                    <p style="margin:0 0 8px 0; font-size:20px; font-weight:600; letter-spacing:-0.02em; line-height:1.3; color:#121212;">
                      Your password was changed
                    </p>
                    <p style="margin:0; font-size:14px; line-height:1.6; color:#6e6e6e;">
                      The password for {{ .Email }} was just changed. If this was you, no action is needed.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 8px 0 8px;" align="center">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#8c8c8c;">
                Didn't make this change? Reset your password right away and contact us if you think this is a mistake.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
